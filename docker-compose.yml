# Local run: Ollama with Intel Arc GPU.
# Requires an Intel Arc GPU on the host (/dev/dri + i915/xe kernel driver).
name: ollama-intel-arc

services:
  ollama-intel-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      # Pin/override versions here when Intel publishes a new portable build.
      # Latest portable files: https://github.com/ipex-llm/ipex-llm/releases/tag/v2.3.0-nightly
      args:
        IPEXLLM_RELEASE_REPO: ipex-llm/ipex-llm
        IPEXLLM_RELEASE_VERSION: v2.3.0-nightly
        IPEXLLM_PORTABLE_TGZ: ollama-ipex-llm-2.3.0b20250725-ubuntu.tgz
    image: tarnyd/ollama-intel-gpu:latest
    container_name: ollama-intel-gpu
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # OLLAMA_INTEL_GPU=1 is baked into the image (required for oneAPI discovery).
      # Multi-GPU hosts only: uncomment to pin a card, e.g. level_zero:1
      # - ONEAPI_DEVICE_SELECTOR=${ONEAPI_DEVICE_SELECTOR}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ollama-data: {}
